name: MaanCamera CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint-and-test:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: maancamera
          POSTGRES_PASSWORD: maancamera_local_dev_password
          POSTGRES_DB: maancamera_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install ruff mypy pytest httpx
          pip install .

      - name: Code Quality & Linting
        run: |
          cd backend
          ruff check .

      - name: Verify Database Schema
        run: |
          PGPASSWORD=maancamera_local_dev_password psql -h localhost -U maancamera -d maancamera_db -f database/schema.sql
          PGPASSWORD=maancamera_local_dev_password psql -h localhost -U maancamera -d maancamera_db -f database/seed.sql

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Dependencies
        run: |
          cd frontend
          pnpm install

      - name: Run Build
        run: |
          cd frontend
          pnpm run build
