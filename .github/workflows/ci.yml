name: MaanCamera CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint-and-test:
    name: Backend Lint, Typecheck & Postgres Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: maancamera
          POSTGRES_PASSWORD: maancamera_local_dev_password
          POSTGRES_DB: maancamera_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maancamera -d maancamera_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:7.2.6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret-key-must-be-at-least-thirty-two-bytes-long
      CSRF_SECRET: ci-test-csrf-secret-key-must-be-at-least-thirty-two-bytes
      APP_DB_USER: maancamera_app
      APP_DB_PASSWORD: maancamera_app_ci_password
      DATABASE_URL: postgresql+asyncpg://maancamera_app:maancamera_app_ci_password@localhost:5432/maancamera_db
      SYNC_DATABASE_URL: postgresql+psycopg2://maancamera:maancamera_local_dev_password@localhost:5432/maancamera_db
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://maancamera:maancamera_local_dev_password@localhost:5432/maancamera_db
      TEST_DATABASE_URL: postgresql+asyncpg://maancamera_app:maancamera_app_ci_password@localhost:5432/maancamera_db
      REDIS_URL: redis://localhost:6379/0
      RATE_LIMIT_STORAGE_URI: redis://localhost:6379/0
      PAYMENT_PROVIDER: mock

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install Locked Dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Smoke Boot & OpenAPI Schema Check
        working-directory: backend
        run: uv run python -c "from app.main import app; spec = app.openapi(); assert len(spec['paths']) > 0; print('OpenAPI paths:', len(spec['paths']))"

      - name: Code Quality & Linting (Ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Static Typechecking (Mypy)
        working-directory: backend
        run: uv run mypy app

      - name: Apply Alembic Migrations, Check Schema Drift & Run Seed
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run python -m app.db.seed

      - name: Run Pytest Suite Against PostgreSQL & Valkey
        working-directory: backend
        run: uv run pytest -q

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install Locked Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Dependency Security Audit
        working-directory: frontend
        run: pnpm audit --audit-level=high

      - name: TypeScript Typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: Production Build
        working-directory: frontend
        run: pnpm run build

  playwright-e2e:
    name: Full-Stack Playwright Browser E2E
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-build]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: maancamera
          POSTGRES_PASSWORD: maancamera_local_dev_password
          POSTGRES_DB: maancamera_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maancamera -d maancamera_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:7.2.6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      DEBUG: "false"
      COOKIE_SECURE: "false"
      RATE_LIMIT_ENABLED: "false"
      SECRET_KEY: ci-test-secret-key-must-be-at-least-thirty-two-bytes-long
      CSRF_SECRET: ci-test-csrf-secret-key-must-be-at-least-thirty-two-bytes
      APP_DB_USER: maancamera_app
      APP_DB_PASSWORD: maancamera_app_ci_password
      DATABASE_URL: postgresql+asyncpg://maancamera_app:maancamera_app_ci_password@localhost:5432/maancamera_db
      SYNC_DATABASE_URL: postgresql+psycopg2://maancamera:maancamera_local_dev_password@localhost:5432/maancamera_db
      REDIS_URL: redis://localhost:6379/0
      RATE_LIMIT_STORAGE_URI: redis://localhost:6379/0
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_S3_URL: http://localhost:8333
      PAYMENT_PROVIDER: mock

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv & Backend Deps
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install Backend Environment & Seed Postgres
        working-directory: backend
        run: |
          uv sync --frozen --extra dev
          uv run alembic upgrade head
          uv run python -m app.db.seed

      - name: Install pnpm & Node.js 20
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Build Frontend & Install Playwright Chromium
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm exec playwright install chromium --with-deps

      - name: Boot Backend & Frontend and Run Playwright E2E
        run: |
          (cd backend && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000) &
          BACK_PID=$!
          (cd frontend && pnpm exec next start -p 3000) &
          FRONT_PID=$!
          trap "kill $BACK_PID $FRONT_PID || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready && curl -fsS http://127.0.0.1:3000 >/dev/null; then
              break
            fi
            sleep 2
          done
          cd frontend && pnpm run test:e2e

  prod-ops-and-backup-check:
    name: Production Compose, Backup & Restore Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: maancamera
          POSTGRES_PASSWORD: maancamera_local_dev_password
          POSTGRES_DB: maancamera_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maancamera -d maancamera_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Production Compose & Monitoring Configs
        env:
          POSTGRES_USER: maancamera
          POSTGRES_PASSWORD: maancamera_local_dev_password
          POSTGRES_DB: maancamera_db
          APP_DB_PASSWORD: maancamera_app_ci_password
          SECRET_KEY: ci-test-secret-key-must-be-at-least-thirty-two-bytes-long
          CSRF_SECRET: ci-test-csrf-secret-key-must-be-at-least-thirty-two-bytes
          S3_PUBLIC_ENDPOINT_URL: https://media.example.com
          S3_ACCESS_KEY_ID: ci_s3_key
          S3_SECRET_ACCESS_KEY: ci_s3_secret
          NEXT_PUBLIC_BACKEND_URL: https://api.example.com/api/v1
          APP_DOMAIN: example.com
          PAYMENT_PROVIDER: bank_transfer
        run: |
          docker compose -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.prod.yml --profile monitoring config -q
          bash -n infra/scripts/backup.sh
          bash -n infra/scripts/restore_verify.sh

      - name: Set up Python 3.11 & Install PostgreSQL Client
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Run Live pg_dump Backup & Restore Drill
        env:
          PGPASSWORD: maancamera_local_dev_password
          POSTGRES_USER: maancamera
          POSTGRES_DB: maancamera_db
          APP_DB_USER: maancamera_app
          APP_DB_PASSWORD: maancamera_app_ci_password
          SYNC_DATABASE_URL: postgresql+psycopg2://maancamera:maancamera_local_dev_password@localhost:5432/maancamera_db
          DATABASE_URL: postgresql+asyncpg://maancamera_app:maancamera_app_ci_password@localhost:5432/maancamera_db
          PG_HOST: localhost
          PG_VERIFY_HOST: localhost
          BACKUP_DIR: /tmp/mc_backups
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          cd backend
          uv sync --frozen
          uv run alembic upgrade head
          uv run python -m app.db.seed
          cd ..
          bash infra/scripts/backup.sh
          DUMP_PATH=$(ls -1 /tmp/mc_backups/*.dump | head -n 1)
          bash infra/scripts/restore_verify.sh "$DUMP_PATH"
