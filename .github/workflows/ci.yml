name: MaanCamera CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint-and-test:
    name: Backend Lint, Typecheck & Postgres Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: maancamera
          POSTGRES_PASSWORD: maancamera_local_dev_password
          POSTGRES_DB: maancamera_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maancamera -d maancamera_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:7.2.6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret-key-must-be-at-least-thirty-two-bytes-long
      CSRF_SECRET: ci-test-csrf-secret-key-must-be-at-least-thirty-two-bytes
      DATABASE_URL: postgresql+asyncpg://maancamera:maancamera_local_dev_password@localhost:5432/maancamera_db
      SYNC_DATABASE_URL: postgresql+psycopg2://maancamera:maancamera_local_dev_password@localhost:5432/maancamera_db
      TEST_DATABASE_URL: postgresql+asyncpg://maancamera:maancamera_local_dev_password@localhost:5432/maancamera_db
      REDIS_URL: redis://localhost:6379/0
      RATE_LIMIT_STORAGE_URI: redis://localhost:6379/0
      PAYMENT_PROVIDER: mock

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install Locked Dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Smoke Boot & OpenAPI Schema Check
        working-directory: backend
        run: uv run python -c "from app.main import app; spec = app.openapi(); assert len(spec['paths']) > 0; print('OpenAPI paths:', len(spec['paths']))"

      - name: Code Quality & Linting (Ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Static Typechecking (Mypy)
        working-directory: backend
        run: uv run mypy app

      - name: Apply Alembic Migrations, Check Schema Drift & Run Seed
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run python -m app.db.seed

      - name: Run Pytest Suite Against PostgreSQL & Valkey
        working-directory: backend
        run: uv run pytest -q

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install Locked Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: TypeScript Typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: Production Build
        working-directory: frontend
        run: pnpm run build
